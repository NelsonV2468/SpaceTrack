# DATABASE_URL, NEON_AUTH_BASE_URL y NEON_AUTH_JWKS_URL llegan como variables de entorno y nunca se versionan.
spacetrack.seguridad.habilitada=true
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Render termina TLS en su proxy; asi Spring reconoce https y marca las cookies como Secure.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=8h
server.error.include-stacktrace=never
server.error.include-message=never
# Tras crear las tablas con Hibernate se aplican indices y reglas de integridad (script idempotente).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/postgresql/robustez.sql
spring.sql.init.separator=@@
spring.sql.init.continue-on-error=false
