<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | SpaceTrack</title>
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="pagina-login">
<main class="tarjeta-login">
    <h1>SpaceTrack</h1>
    <p class="subtitulo">Centro de control de operaciones · City Urban Bogotá</p>
    <form novalidate>
        <label><span>Nombre <span class="sec">(solo para crear cuenta)</span></span>
            <input name="name" autocomplete="name" maxlength="120">
        </label>
        <label>Correo
            <input name="email" type="email" required autocomplete="email" maxlength="160">
        </label>
        <label>Contraseña
            <input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password">
        </label>
        <p class="aviso-login" data-error role="alert" aria-live="polite"></p>
        <button type="submit" class="boton primario">Iniciar sesión</button>
        <button type="button" class="boton secundario" data-signup>Crear cuenta</button>
    </form>
    <p class="nota-login">Las cuentas nuevas quedan pendientes hasta que un administrador les asigne un rol.</p>
</main>
<script src="js/login.bundle.js"></script>
</body>
</html>
