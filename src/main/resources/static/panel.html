<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceTrack | Centro de control</title>
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<div class="app">
    <aside class="lateral">
        <div class="marca-app">
            <div class="isotipo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
                </svg>
            </div>
            <div>
                <strong>SpaceTrack</strong>
                <span>City Urban Bogotá</span>
            </div>
        </div>
        <nav class="menu" id="menu" aria-label="Menú principal"></nav>
        <div class="pie-lateral">
            <div class="estado-servidor" id="estado-servidor"><span class="punto"></span>Servidor local conectado</div>
            <div>Gestión de rutas de distribución</div>
        </div>
    </aside>
    <div class="principal">
        <header class="barra-superior">
            <div class="migas" id="migas">SpaceTrack</div>
            <div class="meta">
                <span class="fecha" id="fecha-actual"></span>
                <div class="usuario">
                    <span class="avatar" aria-hidden="true">CO</span>
                    <span>Centro de operaciones</span>
                </div>
            </div>
        </header>
        <main class="contenido" id="contenido"></main>
    </div>
</div>
<script src="js/mapa.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
