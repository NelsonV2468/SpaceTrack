<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel | SpaceTrack</title>
<style>
    :root { --ink: #17212b; --muted: #64748b; --line: #d9e1e8; --brand: #0f766e; --brand-dark: #115e59; --brand-soft: #e6f4f2; --danger: #b42318; --paper: #ffffff; --wash: #f5f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--wash); color: var(--ink); font-family: Arial, sans-serif; }
    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

    /* Menu lateral */
    .menu { background: var(--paper); border-right: 1px solid var(--line); padding: 26px 16px; }
    .logo { color: var(--brand); font-size: 20px; font-weight: 700; margin: 0 10px 4px; }
    .logo-sub { color: var(--muted); font-size: 12px; margin: 0 10px 26px; }
    .grupo { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; margin: 22px 10px 8px; text-transform: uppercase; }
    .menu button { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: 0; border-radius: 6px; color: var(--ink); cursor: pointer; font: inherit; font-size: 14px; padding: 10px; text-align: left; }
    .menu button:hover { background: var(--wash); }
    .menu button.activo { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
    .contador { background: var(--wash); border-radius: 10px; color: var(--muted); font-size: 12px; min-width: 24px; padding: 2px 7px; text-align: center; }
    .menu button.activo .contador { background: #fff; color: var(--brand); }

    /* Contenido */
    .contenido { padding: 40px 36px; max-width: 1200px; width: 100%; min-width: 0; }
    .menu { min-width: 0; }
    .marca { color: var(--brand); font-size: 12px; font-weight: 700; margin: 0 0 8px; text-transform: uppercase; }
    h1 { font-size: 30px; margin: 0; }
    .subtitulo { color: var(--muted); margin: 8px 0 0; }
    .encabezado { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
    .boton { border: 1px solid transparent; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; min-height: 38px; padding: 8px 14px; }
    .primario { background: var(--brand); color: #fff; } .primario:hover { background: var(--brand-dark); }
    .secundario { background: #fff; border-color: var(--line); color: var(--ink); }
    .peligro { background: #fff; border-color: #f3c6c2; color: var(--danger); padding: 6px 10px; min-height: 32px; font-size: 13px; }
    .caja { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
    .mensaje { border-radius: 6px; margin: 0 0 18px; padding: 12px 14px; }
    .mensaje.exito { background: #d1fae5; color: #065f46; }
    .mensaje.error { background: #fdecea; color: var(--danger); }

    /* Tabla */
    .tabla { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 13px 15px; text-align: left; vertical-align: top; font-size: 14px; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    tbody tr:last-child td { border-bottom: 0; }
    td .sec { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
    .etiqueta { border-radius: 4px; display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 8px; }
    .si { background: #d1fae5; color: #065f46; } .no { background: #e2e8f0; color: #475569; } .alerta { background: #fef3c7; color: #92400e; }
    .vacio { padding: 46px 24px; text-align: center; color: var(--muted); }
    .vacio strong { color: var(--ink); display: block; font-size: 17px; margin-bottom: 6px; }

    /* Formulario */
    .formulario { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 22px; margin-bottom: 22px; }
    .formulario h2 { grid-column: 1 / -1; font-size: 18px; margin: 0; }
    .campo { display: grid; gap: 6px; align-content: start; }
    .campo.ancho, .acciones-form { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 700; }
    input, select { border: 1px solid #aebdcc; border-radius: 5px; font: inherit; min-height: 40px; padding: 8px 10px; width: 100%; background: #fff; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 14px; min-height: 40px; }
    .check input { width: auto; min-height: auto; }
    .dias { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .ayuda { color: var(--muted); font-size: 12px; }
    .campo small { color: var(--danger); font-size: 12px; min-height: 14px; }
    .acciones-form { display: flex; gap: 10px; justify-content: flex-end; }

    /* Inicio */
    .tarjetas { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-bottom: 26px; }
    .tarjeta { padding: 18px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
    .tarjeta:hover { border-color: var(--brand); }
    .tarjeta .numero { color: var(--brand); font-size: 30px; font-weight: 700; }
    .tarjeta .nombre { font-weight: 700; margin-top: 4px; }
    .tarjeta .desc { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .pasos { padding: 20px 24px; }
    .pasos h2 { font-size: 18px; margin: 0 0 12px; }
    .pasos ol { margin: 0; padding-left: 20px; line-height: 1.9; }
    .pasos .ayuda { margin-top: 10px; }

    @media (max-width: 820px) {
        .app { grid-template-columns: 1fr; align-content: start; }
        .menu { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
        .menu nav { display: flex; gap: 6px; overflow-x: auto; }
        .menu button { width: auto; white-space: nowrap; gap: 8px; }
        .grupo, .logo-sub { display: none; }
        .logo { margin-bottom: 12px; }
        .contenido { padding: 24px 16px; }
        .encabezado { flex-direction: column; align-items: flex-start; }
        .formulario { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<div class="app">
    <aside class="menu">
        <p class="logo">SpaceTrack</p>
        <p class="logo-sub">City Urban Bogota</p>
        <nav id="menu"></nav>
    </aside>
    <main class="contenido" id="contenido"></main>
</div>

<script>
// ------------------------------------------------------------------
// Configuracion de cada modulo: endpoint, columnas de la tabla y campos
// del formulario. Para agregar un modulo nuevo basta con sumar una entrada.
// ------------------------------------------------------------------
const DIAS = ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO', 'DOMINGO'];
const siNo = (valor) => etiqueta(valor ? 'Si' : 'No', valor ? 'si' : 'no');
const activo = (valor) => etiqueta(valor ? 'Activo' : 'Inactivo', valor ? 'si' : 'no');

const MODULOS = {
    clientes: {
        grupo: 'Gestion', titulo: 'Clientes', singular: 'cliente', api: '/api/clientes',
        descripcion: 'Empresas que contratan el servicio de distribucion.',
        columnas: [
            ['Empresa', c => doble(c.razonSocial, 'NIT ' + c.nit)],
            ['Contacto', c => doble(c.nombreContacto, c.correoContacto + ' · ' + c.telefonoContacto)],
            ['Direccion', c => texto(c.direccion)],
            ['Estado', c => activo(c.activo)]
        ],
        campos: [
            { nombre: 'razonSocial', etiqueta: 'Razon social', ancho: true },
            { nombre: 'nit', etiqueta: 'NIT', ayuda: 'Ej: 900123456-7' },
            { nombre: 'nombreContacto', etiqueta: 'Nombre de contacto' },
            { nombre: 'correoContacto', etiqueta: 'Correo', tipo: 'email' },
            { nombre: 'telefonoContacto', etiqueta: 'Telefono' },
            { nombre: 'direccion', etiqueta: 'Direccion', ancho: true },
            { nombre: 'activo', etiqueta: 'Cliente activo', tipo: 'check', valor: true }
        ]
    },
    vehiculos: {
        grupo: 'Gestion', titulo: 'Vehiculos', singular: 'vehiculo', api: '/api/vehiculos',
        descripcion: 'Flota disponible para las rutas.',
        columnas: [
            ['Placa', v => doble(v.placa, '')],
            ['Vehiculo', v => doble(v.tipoVehiculo, v.marca + ' ' + v.modelo + ' (' + v.anioModelo + ')')],
            ['Capacidad', v => texto(v.capacidadCargaKg + ' kg')],
            ['Cadena de frio', v => siNo(v.requiereCadenaFrio)],
            ['Estado', v => activo(v.activo)]
        ],
        campos: [
            { nombre: 'placa', etiqueta: 'Placa', ayuda: 'Ej: ABC123' },
            { nombre: 'tipoVehiculo', etiqueta: 'Tipo', tipo: 'select', opciones: ['Camion', 'Camioneta', 'Furgon', 'Motocicleta'] },
            { nombre: 'marca', etiqueta: 'Marca' },
            { nombre: 'modelo', etiqueta: 'Modelo' },
            { nombre: 'anioModelo', etiqueta: 'Ano modelo', tipo: 'number', valor: new Date().getFullYear() },
            { nombre: 'capacidadCargaKg', etiqueta: 'Capacidad (kg)', tipo: 'number' },
            { nombre: 'requiereCadenaFrio', etiqueta: 'Tiene cadena de frio', tipo: 'check' },
            { nombre: 'activo', etiqueta: 'Vehiculo activo', tipo: 'check', valor: true }
        ]
    },
    conductores: {
        grupo: 'Gestion', titulo: 'Conductores', singular: 'conductor', api: '/api/conductores',
        descripcion: 'Personas habilitadas para manejar la flota.',
        columnas: [
            ['Conductor', c => doble(c.nombres + ' ' + c.apellidos, c.tipoDocumento + ' ' + c.numeroDocumento)],
            ['Contacto', c => doble(c.telefono, c.correo)],
            ['Licencia', c => doble(c.numeroLicencia, 'Vence ' + c.fechaVencimientoLicencia)],
            ['Estado', c => activo(c.activo)]
        ],
        campos: [
            { nombre: 'tipoDocumento', etiqueta: 'Tipo de documento', tipo: 'select', opciones: ['CC', 'CE', 'PASAPORTE'] },
            { nombre: 'numeroDocumento', etiqueta: 'Numero de documento' },
            { nombre: 'nombres', etiqueta: 'Nombres' },
            { nombre: 'apellidos', etiqueta: 'Apellidos' },
            { nombre: 'telefono', etiqueta: 'Telefono' },
            { nombre: 'correo', etiqueta: 'Correo', tipo: 'email' },
            { nombre: 'numeroLicencia', etiqueta: 'Numero de licencia' },
            { nombre: 'fechaVencimientoLicencia', etiqueta: 'Vencimiento de licencia', tipo: 'date' },
            { nombre: 'activo', etiqueta: 'Conductor activo', tipo: 'check', valor: true }
        ]
    },
    operaciones: {
        grupo: 'Gestion', titulo: 'Operaciones', singular: 'operacion', api: '/api/operaciones',
        descripcion: 'Contratos de distribucion de cada cliente.',
        columnas: [
            ['Contrato', o => doble(o.codigoContrato, o.nombreOperacion)],
            ['Cliente', o => texto(o.razonSocialCliente)],
            ['Vigencia', o => doble(o.fechaInicio + ' a ' + o.fechaFin, o.diasOperacion)],
            ['Planificacion', o => doble(o.numeroVehiculosRequeridos + ' vehiculos', o.numeroEntregasEsperadas + ' entregas')],
            ['Estado', o => etiqueta(o.estado, o.estado === 'ACTIVA' ? 'si' : o.estado === 'PAUSADA' ? 'alerta' : 'no')]
        ],
        campos: [
            { nombre: 'codigoContrato', etiqueta: 'Codigo de contrato', ayuda: 'Ej: CT-2026-001' },
            { nombre: 'clienteId', etiqueta: 'Cliente', tipo: 'relacion', fuente: 'clientes', mostrar: c => c.razonSocial },
            { nombre: 'nombreOperacion', etiqueta: 'Nombre de la operacion', ancho: true },
            { nombre: 'fechaInicio', etiqueta: 'Fecha de inicio', tipo: 'date', valor: hoy(0) },
            { nombre: 'fechaFin', etiqueta: 'Fecha de fin', tipo: 'date', valor: hoy(90) },
            { nombre: 'diasOperacion', etiqueta: 'Dias de operacion', valor: 'Lunes a sabado' },
            { nombre: 'estado', etiqueta: 'Estado', tipo: 'select', opciones: ['ACTIVA', 'PAUSADA', 'FINALIZADA'] },
            { nombre: 'numeroVehiculosRequeridos', etiqueta: 'Vehiculos requeridos', tipo: 'number', valor: 1 },
            { nombre: 'numeroEntregasEsperadas', etiqueta: 'Entregas esperadas', tipo: 'number', valor: 1 },
            { nombre: 'requiereCadenaFrio', etiqueta: 'Requiere cadena de frio', tipo: 'check' }
        ]
    },
    necesidades: {
        grupo: 'Planeacion', titulo: 'Necesidades', singular: 'necesidad', api: '/api/necesidades',
        descripcion: 'Lo que pide el cliente: vehiculos, dias y horario de operacion.',
        columnas: [
            ['Contrato', n => doble(n.codigoContrato, n.razonSocialCliente)],
            ['Vehiculos', n => doble(n.cantidadVehiculos + ' x ' + n.tipoVehiculo, 'Min. ' + n.capacidadMinimaKg + ' kg' + (n.requiereCadenaFrio ? ' · con frio' : ''))],
            ['Dias y horario', n => doble(n.diasOperacion.map(d => d.slice(0, 3)).join(', '), n.horaInicio.slice(0, 5) + ' a ' + n.horaFin.slice(0, 5))],
            ['Flota', n => etiqueta(n.vehiculosDisponibles + ' disponibles', n.flotaSuficiente ? 'si' : 'alerta')]
        ],
        campos: [
            { nombre: 'operacionId', etiqueta: 'Operacion / contrato', tipo: 'relacion', fuente: 'operaciones', mostrar: o => o.codigoContrato + ' - ' + o.razonSocialCliente, ancho: true },
            { nombre: 'tipoVehiculo', etiqueta: 'Tipo de vehiculo', tipo: 'select', opciones: ['Camion', 'Camioneta', 'Furgon', 'Motocicleta'] },
            { nombre: 'cantidadVehiculos', etiqueta: 'Cantidad de vehiculos', tipo: 'number', valor: 1 },
            { nombre: 'capacidadMinimaKg', etiqueta: 'Capacidad minima (kg)', tipo: 'number' },
            { nombre: 'requiereCadenaFrio', etiqueta: 'Requiere cadena de frio', tipo: 'check' },
            { nombre: 'diasOperacion', etiqueta: 'Dias de operacion', tipo: 'dias', ancho: true },
            { nombre: 'horaInicio', etiqueta: 'Hora de inicio', tipo: 'time', valor: '06:00' },
            { nombre: 'horaFin', etiqueta: 'Hora de fin', tipo: 'time', valor: '14:00' },
            { nombre: 'observaciones', etiqueta: 'Observaciones (opcional)', ancho: true, opcional: true }
        ]
    },
    zonas: {
        grupo: 'Planeacion', titulo: 'Zonas', singular: 'zona', api: '/api/zonas',
        descripcion: 'Areas de la ciudad que cubren las rutas.',
        columnas: [
            ['Zona', z => doble(z.nombre, z.codigo)],
            ['Localidad', z => texto(z.localidad)],
            ['Descripcion', z => texto(z.descripcion || '-')],
            ['Estado', z => activo(z.activa)]
        ],
        campos: [
            { nombre: 'codigo', etiqueta: 'Codigo', ayuda: 'Ej: Z-NORTE' },
            { nombre: 'nombre', etiqueta: 'Nombre' },
            { nombre: 'localidad', etiqueta: 'Localidad', ayuda: 'Ej: Usaquen' },
            { nombre: 'descripcion', etiqueta: 'Descripcion (opcional)', opcional: true },
            { nombre: 'activa', etiqueta: 'Zona activa', tipo: 'check', valor: true }
        ]
    },
    rutas: {
        grupo: 'Planeacion', titulo: 'Rutas', singular: 'ruta', api: '/api/rutas',
        descripcion: 'Recorridos de distribucion por zona y contrato.',
        columnas: [
            ['Ruta', r => doble(r.codigo, r.nombre)],
            ['Zona y contrato', r => doble(r.nombreZona, r.codigoContrato)],
            ['Recorrido', r => doble(r.puntoOrigen + ' → ' + r.puntoDestino, r.distanciaEstimadaKm + ' km')],
            ['Entregas', r => texto(r.numeroEntregasProgramadas)]
        ],
        campos: [
            { nombre: 'codigo', etiqueta: 'Codigo', ayuda: 'Ej: R-001' },
            { nombre: 'nombre', etiqueta: 'Nombre' },
            { nombre: 'zonaId', etiqueta: 'Zona', tipo: 'relacion', fuente: 'zonas', mostrar: z => z.nombre + ' (' + z.codigo + ')' },
            { nombre: 'operacionId', etiqueta: 'Operacion / contrato', tipo: 'relacion', fuente: 'operaciones', mostrar: o => o.codigoContrato + ' - ' + o.razonSocialCliente },
            { nombre: 'puntoOrigen', etiqueta: 'Punto de origen' },
            { nombre: 'puntoDestino', etiqueta: 'Punto de destino' },
            { nombre: 'distanciaEstimadaKm', etiqueta: 'Distancia estimada (km)', tipo: 'number' },
            { nombre: 'numeroEntregasProgramadas', etiqueta: 'Entregas programadas', tipo: 'number', valor: 1 }
        ]
    }
};

// ------------------------------------------------------------------
// Estado y utilidades
// ------------------------------------------------------------------
const estado = { vista: 'inicio', datos: {}, mensaje: null };
const $contenido = document.getElementById('contenido');

function hoy(dias) {
    const fecha = new Date();
    fecha.setDate(fecha.getDate() + dias);
    return fecha.toISOString().slice(0, 10);
}

function el(etiquetaHtml, atributos = {}, hijos = []) {
    const nodo = document.createElement(etiquetaHtml);
    Object.entries(atributos).forEach(([clave, valor]) => {
        if (clave === 'texto') nodo.textContent = valor;
        else if (clave.startsWith('on')) nodo.addEventListener(clave.slice(2), valor);
        else if (valor !== false && valor !== undefined) nodo.setAttribute(clave, valor === true ? '' : valor);
    });
    [].concat(hijos).forEach(hijo => hijo && nodo.append(hijo));
    return nodo;
}
function texto(valor) { return document.createTextNode(valor ?? ''); }
function doble(principal, secundario) {
    return el('div', {}, [el('strong', { texto: principal ?? '' }), secundario ? el('span', { class: 'sec', texto: secundario }) : null]);
}
function etiqueta(valor, clase) { return el('span', { class: 'etiqueta ' + clase, texto: valor }); }

async function api(metodo, url, cuerpo) {
    const respuesta = await fetch(url, {
        method: metodo,
        headers: cuerpo ? { 'Content-Type': 'application/json' } : {},
        body: cuerpo ? JSON.stringify(cuerpo) : undefined
    });
    if (respuesta.status === 204) return null;
    const datos = await respuesta.json().catch(() => ({}));
    if (!respuesta.ok) {
        const error = new Error(datos.mensaje || 'No se pudo completar la operacion (' + respuesta.status + ')');
        error.campos = datos.errores || {};
        throw error;
    }
    return datos;
}

async function cargar(clave) {
    try {
        estado.datos[clave] = await api('GET', MODULOS[clave].api);
    } catch (e) {
        estado.datos[clave] = null;
    }
}

// ------------------------------------------------------------------
// Menu
// ------------------------------------------------------------------
function pintarMenu() {
    const menu = document.getElementById('menu');
    menu.replaceChildren();
    menu.append(botonMenu('inicio', 'Inicio', null));
    let grupoActual = '';
    Object.entries(MODULOS).forEach(([clave, modulo]) => {
        if (modulo.grupo !== grupoActual) {
            grupoActual = modulo.grupo;
            menu.append(el('p', { class: 'grupo', texto: grupoActual }));
        }
        const lista = estado.datos[clave];
        menu.append(botonMenu(clave, modulo.titulo, Array.isArray(lista) ? lista.length : '-'));
    });
}
function botonMenu(clave, titulo, cantidad) {
    return el('button', { class: estado.vista === clave ? 'activo' : '', onclick: () => ir(clave) },
        [el('span', { texto: titulo }), cantidad === null ? null : el('span', { class: 'contador', texto: cantidad })]);
}

async function ir(vista) {
    estado.vista = vista;
    estado.mensaje = null;
    if (vista === 'inicio') await Promise.all(Object.keys(MODULOS).map(cargar));
    else await cargar(vista);
    pintar();
}

function pintar() {
    pintarMenu();
    $contenido.replaceChildren();
    if (estado.vista === 'inicio') pintarInicio();
    else pintarModulo(estado.vista);
}

// ------------------------------------------------------------------
// Vista de inicio
// ------------------------------------------------------------------
function pintarInicio() {
    $contenido.append(el('header', { class: 'encabezado' }, [el('div', {}, [
        el('p', { class: 'marca', texto: 'SpaceTrack / Panel general' }),
        el('h1', { texto: 'Bienvenido' }),
        el('p', { class: 'subtitulo', texto: 'Resumen de lo que hay registrado. Haz clic en un modulo para verlo.' })
    ])]));
    const tarjetas = el('section', { class: 'tarjetas' });
    Object.entries(MODULOS).forEach(([clave, modulo]) => {
        const lista = estado.datos[clave];
        tarjetas.append(el('button', { class: 'caja tarjeta', onclick: () => ir(clave) }, [
            el('div', { class: 'numero', texto: Array.isArray(lista) ? lista.length : '-' }),
            el('div', { class: 'nombre', texto: modulo.titulo }),
            el('div', { class: 'desc', texto: modulo.descripcion })
        ]));
    });
    $contenido.append(tarjetas);
    $contenido.append(el('section', { class: 'caja pasos' }, [
        el('h2', { texto: 'Orden recomendado para registrar' }),
        el('ol', {}, [
            el('li', { texto: 'Registra el cliente y la flota (vehiculos y conductores).' }),
            el('li', { texto: 'Crea la operacion o contrato del cliente.' }),
            el('li', { texto: 'Registra la necesidad del cliente: vehiculos, dias y horario.' }),
            el('li', { texto: 'Crea las zonas de la ciudad.' }),
            el('li', { texto: 'Crea las rutas, cada una con su zona y su contrato.' })
        ]),
        el('p', { class: 'ayuda', texto: 'Cada paso necesita los datos del anterior; por eso las listas de seleccion aparecen vacias si aun no has creado lo previo.' })
    ]));
}

// ------------------------------------------------------------------
// Vista de un modulo: tabla + formulario de registro
// ------------------------------------------------------------------
function pintarModulo(clave) {
    const modulo = MODULOS[clave];
    const lista = estado.datos[clave];
    $contenido.append(el('header', { class: 'encabezado' }, [
        el('div', {}, [
            el('p', { class: 'marca', texto: 'SpaceTrack / ' + modulo.grupo }),
            el('h1', { texto: modulo.titulo }),
            el('p', { class: 'subtitulo', texto: modulo.descripcion })
        ]),
        el('button', { class: 'boton primario', id: 'abrir-form', onclick: () => abrirFormulario(clave) }, texto('Registrar ' + modulo.singular))
    ]));
    if (estado.mensaje) $contenido.append(el('p', { class: 'mensaje ' + estado.mensaje.tipo, texto: estado.mensaje.texto }));
    $contenido.append(el('div', { id: 'zona-form' }));

    if (lista === null) {
        $contenido.append(el('section', { class: 'caja vacio' }, [el('strong', { texto: 'No se pudo cargar la informacion' }), texto('Verifica que la aplicacion este corriendo.')]));
        return;
    }
    if (!lista.length) {
        $contenido.append(el('section', { class: 'caja vacio' }, [el('strong', { texto: 'Aun no hay registros' }), texto('Usa el boton "Registrar ' + modulo.singular + '" para crear el primero.')]));
        return;
    }
    const encabezados = modulo.columnas.map(([titulo]) => el('th', { texto: titulo })).concat(el('th', { texto: '' }));
    const filas = lista.map(item => el('tr', {}, modulo.columnas.map(([, render]) => el('td', {}, render(item)))
        .concat(el('td', {}, el('button', { class: 'boton peligro', onclick: () => eliminar(clave, item.id) }, texto('Eliminar'))))));
    $contenido.append(el('section', { class: 'caja tabla' }, el('table', {}, [el('thead', {}, el('tr', {}, encabezados)), el('tbody', {}, filas)])));
}

async function abrirFormulario(clave) {
    const modulo = MODULOS[clave];
    // Las listas desplegables de relaciones se llenan con datos actuales.
    const fuentes = [...new Set(modulo.campos.filter(c => c.tipo === 'relacion').map(c => c.fuente))];
    await Promise.all(fuentes.map(cargar));

    const formulario = el('form', { class: 'caja formulario', novalidate: true, onsubmit: (evento) => guardar(evento, clave) });
    formulario.append(el('h2', { texto: 'Nuevo registro: ' + modulo.singular }));
    modulo.campos.forEach(campo => formulario.append(crearCampo(campo)));
    formulario.append(el('div', { class: 'acciones-form' }, [
        el('button', { type: 'button', class: 'boton secundario', onclick: () => document.getElementById('zona-form').replaceChildren() }, texto('Cancelar')),
        el('button', { type: 'submit', class: 'boton primario' }, texto('Guardar'))
    ]));
    const zona = document.getElementById('zona-form');
    zona.replaceChildren(formulario);
    formulario.querySelector('input, select').focus();
}

function crearCampo(campo) {
    const id = 'f-' + campo.nombre;
    const contenedor = el('div', { class: 'campo' + (campo.ancho ? ' ancho' : '') });
    if (campo.tipo === 'check') {
        contenedor.append(el('label', { class: 'check' }, [el('input', { type: 'checkbox', name: campo.nombre, checked: !!campo.valor }), texto(campo.etiqueta)]));
        return contenedor;
    }
    contenedor.append(el('label', { for: id, texto: campo.etiqueta }));
    if (campo.tipo === 'dias') {
        contenedor.append(el('div', { class: 'dias' }, DIAS.map(dia => el('label', { class: 'check' }, [
            el('input', { type: 'checkbox', name: 'diasOperacion', value: dia, checked: dia !== 'DOMINGO' }), texto(dia.charAt(0) + dia.slice(1).toLowerCase())
        ]))));
    } else if (campo.tipo === 'select' || campo.tipo === 'relacion') {
        const select = el('select', { id, name: campo.nombre }, el('option', { value: '', texto: 'Seleccione...' }));
        if (campo.tipo === 'select') campo.opciones.forEach(op => select.append(el('option', { value: op, texto: op })));
        else (estado.datos[campo.fuente] || []).forEach(item => select.append(el('option', { value: item.id, texto: campo.mostrar(item) })));
        if (campo.tipo === 'select' && campo.opciones.length) select.value = campo.opciones[0];
        contenedor.append(select);
        if (campo.tipo === 'relacion' && !(estado.datos[campo.fuente] || []).length) {
            contenedor.append(el('span', { class: 'ayuda', texto: 'Primero registra ' + MODULOS[campo.fuente].titulo.toLowerCase() + '.' }));
        }
    } else {
        contenedor.append(el('input', { id, name: campo.nombre, type: campo.tipo || 'text', value: campo.valor ?? '', step: campo.tipo === 'number' ? 'any' : false }));
    }
    if (campo.ayuda) contenedor.append(el('span', { class: 'ayuda', texto: campo.ayuda }));
    contenedor.append(el('small', { 'data-error': campo.nombre }));
    return contenedor;
}

function leerFormulario(formulario, modulo) {
    const cuerpo = {};
    modulo.campos.forEach(campo => {
        if (campo.tipo === 'check') cuerpo[campo.nombre] = formulario.elements[campo.nombre].checked;
        else if (campo.tipo === 'dias') cuerpo[campo.nombre] = [...formulario.querySelectorAll('input[name=diasOperacion]:checked')].map(c => c.value);
        else {
            const valor = formulario.elements[campo.nombre].value.trim();
            if (valor === '') cuerpo[campo.nombre] = campo.opcional ? null : (campo.tipo === 'number' || campo.tipo === 'relacion' ? null : '');
            else cuerpo[campo.nombre] = campo.tipo === 'number' || campo.tipo === 'relacion' ? Number(valor) : valor;
        }
    });
    return cuerpo;
}

async function guardar(evento, clave) {
    evento.preventDefault();
    const formulario = evento.target;
    const modulo = MODULOS[clave];
    formulario.querySelectorAll('[data-error]').forEach(s => s.textContent = '');
    formulario.querySelector('.mensaje')?.remove();
    try {
        await api('POST', modulo.api, leerFormulario(formulario, modulo));
        estado.mensaje = { tipo: 'exito', texto: 'Registro de ' + modulo.singular + ' guardado correctamente.' };
        await cargar(clave);
        pintar();
    } catch (error) {
        Object.entries(error.campos).forEach(([campo, texto]) => {
            const destino = formulario.querySelector('[data-error="' + campo + '"]');
            if (destino) destino.textContent = texto;
        });
        // Errores que no son de un campo (reglas de negocio o validaciones cruzadas).
        const sueltos = Object.keys(error.campos).filter(c => !formulario.querySelector('[data-error="' + c + '"]'));
        const detalle = sueltos.map(c => error.campos[c]).join(' ');
        formulario.querySelector('h2').after(el('p', { class: 'mensaje error campo ancho', texto: error.message + (detalle ? ': ' + detalle : '') }));
    }
}

async function eliminar(clave, id) {
    const modulo = MODULOS[clave];
    if (!confirm('¿Eliminar este registro de ' + modulo.singular + '?')) return;
    try {
        await api('DELETE', modulo.api + '/' + id);
        estado.mensaje = { tipo: 'exito', texto: 'Registro eliminado.' };
    } catch (error) {
        estado.mensaje = { tipo: 'error', texto: error.message };
    }
    await cargar(clave);
    pintar();
}

ir('inicio');
</script>
