<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vehiculo | SpaceTrack</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="contenedor formulario-contenedor"><nav class="navegacion"><a th:href="@{/clientes}">Clientes</a><a class="seleccionado" th:href="@{/vehiculos}">Vehiculos</a><a th:href="@{/conductores}">Conductores</a><a th:href="@{/operaciones}">Operaciones</a></nav><a class="volver" th:href="@{/vehiculos}">Volver a vehiculos</a><header class="encabezado compacto"><div><p class="marca">GESTION DE FLOTA</p><h1 th:text="${modoEdicion} ? 'Editar vehiculo' : 'Registrar vehiculo'"></h1></div></header>
<form class="formulario" th:object="${vehiculo}" method="post" th:action="${modoEdicion} ? @{/vehiculos/{id}(id=${vehiculoId})} : @{/vehiculos}"><p class="mensaje error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p><div class="campo"><label for="placa">Placa</label><input id="placa" th:field="*{placa}" placeholder="ABC123"><small th:errors="*{placa}"></small></div><div class="campo"><label for="tipoVehiculo">Tipo de vehiculo</label><select id="tipoVehiculo" th:field="*{tipoVehiculo}"><option value="">Seleccione</option><option>Camion</option><option>Camioneta</option><option>Furgon</option><option>Motocicleta</option></select><small th:errors="*{tipoVehiculo}"></small></div><div class="campo"><label for="marca">Marca</label><input id="marca" th:field="*{marca}"><small th:errors="*{marca}"></small></div><div class="campo"><label for="modelo">Modelo</label><input id="modelo" th:field="*{modelo}"><small th:errors="*{modelo}"></small></div><div class="campo"><label for="anioModelo">Ano modelo</label><input id="anioModelo" type="number" th:field="*{anioModelo}" min="1950" max="2100"><small th:errors="*{anioModelo}"></small></div><div class="campo"><label for="capacidadCargaKg">Capacidad de carga (kg)</label><input id="capacidadCargaKg" type="number" step="0.1" th:field="*{capacidadCargaKg}"><small th:errors="*{capacidadCargaKg}"></small></div><label class="interruptor"><input type="checkbox" th:field="*{requiereCadenaFrio}"> Requiere cadena de frio</label><label class="interruptor"><input type="checkbox" th:field="*{activo}"> Vehiculo activo</label><div class="formulario-acciones"><a class="boton secundario" th:href="@{/vehiculos}">Cancelar</a><button class="boton primario" type="submit" th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar vehiculo'"></button></div></form></main></body></html>
