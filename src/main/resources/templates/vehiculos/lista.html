<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vehiculos | SpaceTrack</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="contenedor"><nav class="navegacion"><a th:href="@{/clientes}">Clientes</a><a class="seleccionado" th:href="@{/vehiculos}">Vehiculos</a><a th:href="@{/conductores}">Conductores</a><a th:href="@{/operaciones}">Operaciones</a></nav>
<header class="encabezado"><div><p class="marca">SPACETRACK / GESTION DE FLOTA</p><h1>Vehiculos</h1><p class="subtitulo">Vehiculos disponibles para las rutas de distribucion.</p></div><a class="boton primario" th:href="@{/vehiculos/nuevo}">Registrar vehiculo</a></header>
<p class="mensaje exito" th:if="${exito}" th:text="${exito}"></p>
<section class="tabla-contenedor" th:if="${!vehiculos.isEmpty()}"><table><thead><tr><th>Placa</th><th>Vehiculo</th><th>Capacidad</th><th>Frio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="vehiculo : ${vehiculos}"><td><strong th:text="${vehiculo.placa}"></strong></td><td><strong th:text="${vehiculo.tipoVehiculo}"></strong><span th:text="${vehiculo.marca + ' ' + vehiculo.modelo + ' (' + vehiculo.anioModelo + ')'}"></span></td><td th:text="${vehiculo.capacidadCargaKg + ' kg'}"></td><td th:text="${vehiculo.requiereCadenaFrio} ? 'Si' : 'No'"></td><td><span class="estado" th:classappend="${vehiculo.activo} ? ' activo' : ' inactivo'" th:text="${vehiculo.activo} ? 'Activo' : 'Inactivo'"></span></td><td class="acciones"><a class="boton secundario" th:href="@{/vehiculos/{id}/editar(id=${vehiculo.id})}">Editar</a><form th:action="@{/vehiculos/{id}/eliminar(id=${vehiculo.id})}" method="post"><button class="boton peligro" type="submit" onclick="return confirm('¿Eliminar este vehiculo?')">Eliminar</button></form></td></tr></tbody></table></section>
<section class="vacio" th:if="${vehiculos.isEmpty()}"><h2>Aun no hay vehiculos registrados</h2><p>Registra la flota que se asignara a las futuras rutas.</p></section></main></body></html>
