<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Operacion | SpaceTrack</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="contenedor formulario-contenedor"><nav class="navegacion"><a th:href="@{/clientes}">Clientes</a><a th:href="@{/vehiculos}">Vehiculos</a><a th:href="@{/conductores}">Conductores</a><a class="seleccionado" th:href="@{/operaciones}">Operaciones</a></nav><a class="volver" th:href="@{/operaciones}">Volver a operaciones</a><header class="encabezado compacto"><div><p class="marca">CONTRATOS Y OPERACIONES</p><h1 th:text="${modoEdicion} ? 'Editar operacion' : 'Registrar operacion'"></h1></div></header>
<form class="formulario" th:object="${operacion}" method="post" th:action="${modoEdicion} ? @{/operaciones/{id}(id=${operacionId})} : @{/operaciones}"><p class="mensaje error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p><div class="campo"><label for="codigoContrato">Codigo de contrato</label><input id="codigoContrato" th:field="*{codigoContrato}" placeholder="CT-2026-001"><small th:errors="*{codigoContrato}"></small></div><div class="campo"><label for="clienteId">Cliente</label><select id="clienteId" th:field="*{clienteId}"><option value="">Seleccione un cliente</option><option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.razonSocial}"></option></select><small th:errors="*{clienteId}"></small></div><div class="campo ancho"><label for="nombreOperacion">Nombre de operacion</label><input id="nombreOperacion" th:field="*{nombreOperacion}" placeholder="Distribucion urbana de alimentos"><small th:errors="*{nombreOperacion}"></small></div><div class="campo"><label for="fechaInicio">Fecha de inicio</label><input id="fechaInicio" type="date" th:field="*{fechaInicio}"><small th:errors="*{fechaInicio}"></small></div><div class="campo"><label for="fechaFin">Fecha de finalizacion</label><input id="fechaFin" type="date" th:field="*{fechaFin}"><small th:errors="*{fechaFin}"></small></div><div class="campo"><label for="diasOperacion">Dias de operacion</label><input id="diasOperacion" th:field="*{diasOperacion}" placeholder="Lunes a sabado"><small th:errors="*{diasOperacion}"></small></div><div class="campo"><label for="estado">Estado</label><select id="estado" th:field="*{estado}"><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option></select><small th:errors="*{estado}"></small></div><div class="campo"><label for="numeroVehiculosRequeridos">Vehiculos requeridos</label><input id="numeroVehiculosRequeridos" type="number" min="1" th:field="*{numeroVehiculosRequeridos}"><small th:errors="*{numeroVehiculosRequeridos}"></small></div><div class="campo"><label for="numeroEntregasEsperadas">Entregas esperadas</label><input id="numeroEntregasEsperadas" type="number" min="1" th:field="*{numeroEntregasEsperadas}"><small th:errors="*{numeroEntregasEsperadas}"></small></div><label class="interruptor"><input type="checkbox" th:field="*{requiereCadenaFrio}"> Requiere cadena de frio</label><div class="formulario-acciones"><a class="boton secundario" th:href="@{/operaciones}">Cancelar</a><button class="boton primario" type="submit" th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar operacion'"></button></div></form></main></body></html>
