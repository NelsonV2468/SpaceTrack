<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conductor | SpaceTrack</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="contenedor formulario-contenedor"><nav class="navegacion"><a th:href="@{/clientes}">Clientes</a><a th:href="@{/vehiculos}">Vehiculos</a><a class="seleccionado" th:href="@{/conductores}">Conductores</a><a th:href="@{/operaciones}">Operaciones</a></nav><a class="volver" th:href="@{/conductores}">Volver a conductores</a><header class="encabezado compacto"><div><p class="marca">GESTION DE PERSONAL</p><h1 th:text="${modoEdicion} ? 'Editar conductor' : 'Registrar conductor'"></h1></div></header>
<form class="formulario" th:object="${conductor}" method="post" th:action="${modoEdicion} ? @{/conductores/{id}(id=${conductorId})} : @{/conductores}"><p class="mensaje error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p><div class="campo"><label for="tipoDocumento">Tipo de documento</label><select id="tipoDocumento" th:field="*{tipoDocumento}"><option value="CC">CC</option><option value="CE">CE</option><option value="PASAPORTE">PASAPORTE</option></select><small th:errors="*{tipoDocumento}"></small></div><div class="campo"><label for="numeroDocumento">Numero de documento</label><input id="numeroDocumento" th:field="*{numeroDocumento}"><small th:errors="*{numeroDocumento}"></small></div><div class="campo"><label for="nombres">Nombres</label><input id="nombres" th:field="*{nombres}"><small th:errors="*{nombres}"></small></div><div class="campo"><label for="apellidos">Apellidos</label><input id="apellidos" th:field="*{apellidos}"><small th:errors="*{apellidos}"></small></div><div class="campo"><label for="telefono">Telefono</label><input id="telefono" th:field="*{telefono}"><small th:errors="*{telefono}"></small></div><div class="campo"><label for="correo">Correo</label><input id="correo" type="email" th:field="*{correo}"><small th:errors="*{correo}"></small></div><div class="campo"><label for="numeroLicencia">Numero de licencia</label><input id="numeroLicencia" th:field="*{numeroLicencia}"><small th:errors="*{numeroLicencia}"></small></div><div class="campo"><label for="fechaVencimientoLicencia">Vencimiento de licencia</label><input id="fechaVencimientoLicencia" type="date" th:field="*{fechaVencimientoLicencia}"><small th:errors="*{fechaVencimientoLicencia}"></small></div><label class="interruptor"><input type="checkbox" th:field="*{activo}"> Conductor activo</label><div class="formulario-acciones"><a class="boton secundario" th:href="@{/conductores}">Cancelar</a><button class="boton primario" type="submit" th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar conductor'"></button></div></form></main></body></html>
