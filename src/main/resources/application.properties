spring.application.name=SpaceTrack
spring.profiles.default=dev
# Render (y otros PaaS) asignan el puerto en la variable PORT.
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.whitelabel.enabled=false
spacetrack.simulacion.intervalo-segundos=10
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Login con Neon Auth y control de roles. En dev queda apagado; prod lo exige.
spacetrack.seguridad.habilitada=false
spacetrack.seguridad.correos-admin=${SPACETRACK_ADMIN_EMAIL:}
