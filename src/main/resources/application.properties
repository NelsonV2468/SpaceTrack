spring.application.name=SpaceTrack
spring.profiles.default=dev
# Render (y otros PaaS) asignan el puerto en la variable PORT.
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.whitelabel.enabled=false
# Los recursos estaticos (frontend Next.js + estilos Thymeleaf) los registra FrontendConfig.
spring.web.resources.add-mappings=false
spacetrack.simulacion.intervalo-segundos=10
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Login con Neon Auth y control de roles. En dev queda apagado; prod lo exige.
spacetrack.seguridad.habilitada=false
spacetrack.seguridad.correos-admin=${SPACETRACK_ADMIN_EMAIL:}
spacetrack.posiciones.retencion-dias=30
spacetrack.posiciones.purga-cron=0 30 2 * * *
# ON-4: alertas de rutas proximas a terminar su franja horaria sin completar entregas.
spacetrack.alertas.minutos-aviso=60
spacetrack.alertas.minutos-por-entrega=10
# Desvio de ruta: distancia (km) entre la posicion reportada por el vehiculo y su recorrido planeado.
spacetrack.alertas.desvio-km=0.5
spacetrack.alertas.desvio-critico-km=2.0
# Minutos que una posicion reportada (GPS/manual) sigue vigente antes de volver a la simulada.
spacetrack.posiciones.vigencia-reporte-minutos=30
